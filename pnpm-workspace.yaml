packages:
  - apps/*
  - packages/*

# Build scripts: allowlist explícita. pnpm 11 trata como error fatal cualquier
# paquete con build script que quede "ignored" (ERR_PNPM_IGNORED_BUILDS → exit 1
# en CI/Vercel). Al permitirlos aquí, pnpm ejecuta sus scripts (todos seguros:
# binarios prebuilt) y no queda ninguno ignorado → `pnpm install` sale 0.
onlyBuiltDependencies:
  - '@clerk/shared'
  - esbuild
  - msw
  - protobufjs
  - sharp
  - unrs-resolver

# Registro lento/inestable para tarballs grandes (next, @next/swc-*).
# Serializamos descargas y ampliamos timeouts para evitar abortos.
networkConcurrency: 1
fetchTimeout: 1200000
fetchRetries: 6
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 180000
