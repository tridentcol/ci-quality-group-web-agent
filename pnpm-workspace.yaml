packages:
  - apps/*
  - packages/*

# Build scripts: declaramos explícitamente los paquetes con script de build como
# ignorados. En un install fresco (CI/Vercel) pnpm 11 trata los "ignored builds"
# no declarados como error fatal; al listarlos aquí, la decisión está tomada y
# `pnpm install` sale 0. (Vercel provee su propio sharp para Next image optimization.)
ignoredBuiltDependencies:
  - '@clerk/shared'
  - esbuild
  - msw
  - protobufjs
  - sharp
  - unrs-resolver

# Registro lento/inestable para tarballs grandes (next, @next/swc-*).
# Serializamos descargas y ampliamos timeouts para evitar abortos.
networkConcurrency: 1
fetchTimeout: 1200000
fetchRetries: 6
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 180000
