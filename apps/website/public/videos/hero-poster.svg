<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D0D0D"/>
      <stop offset="1" stop-color="#111a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1600 180) scale(700)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A8C2F" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3A8C2F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="52" height="52" patternTransform="rotate(115)" patternUnits="userSpaceOnUse">
      <rect width="26" height="52" fill="#141414"/>
      <rect x="26" width="26" height="52" fill="#101010"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#stripes)" opacity="0.35"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
</svg>
